baseURL: https://bintree.org/
languageCode: en-us
title: BinTree
theme: ["PaperMod"]
paginate: 5

enableRobotsTXT: true
buildDrafts: false
buildFuture: true
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  mainSections: ["posts"]
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: BinTree
  description: "Stas Yankovskiy blogging about AI development methodologies, next-gen programming paradigms, and the future of software engineering."
  keywords: [
    "Software Engineering",
    "AI-Native OOP",
    "AI-Driven Development",
    "Software Architecture",
    "System Design",
    "Programming Paradigms",
    "Intent-Based Language",
    "Message Passing",
    "Future of Software",
    "Stas Yankovskiy",
    "Tech Blog"
  ]
  author: Stas Yankovskiy
  images: ["/images/og-image.jpg"]
  DateFormat: "January 2, 2006"
  defaultTheme: auto # dark, light
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: false
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocopen: false

  assets:
    # disableHLJS: true # to disable highlight.js
    disableFingerprinting: true
    favicon: "/images/favicon/favicon.ico"
    favicon16x16: "/images/favicon/favicon-16x16.png"
    favicon32x32: "/images/favicon/favicon-32x32.png"
    apple_touch_icon: "/images/favicon/apple-touch-icon.png"
    # safari_pinned_tab: "<link / abs url>"

  label:
    text: "BinTree"
    # icon: /apple-touch-icon.png
    iconHeight: 35

  # profile-mode
  profileMode:
    enabled: true # needs to be explicitly set
    title: BinTree
    subtitle: "The computing blog by Stas Yankovskiy"
    imageUrl: "/images/avatar.jpeg"
    imageWidth: 120
    imageHeight: 120
    imageTitle: avatar
    # buttons:
    #   - name: Posts
    #     url: posts
    #   - name: Tags
    #     url: tags

  # home-info mode
  homeInfoParams:
    Title: "The computing blog by Stas Yankovskiy"
    Content: Software engineering for the AI era. Redefining OOP, universal system design, and programming paradigms.

  socialIcons:
    - name: github
      url: "https://github.com/stasyanko"
    - name: X
      url: "https://x.com/bintree_xxl"

  # analytics:
  #   google:
  #     SiteVerificationTag: ""

  cover:
    hidden: false # hide everywhere but not in structured data
    hiddenInList: false # hide on list pages and home
    hiddenInSingle: false # hide on single page

  editPost:
    URL: "https://github.com/stasyanko/bintree/content"
    Text: "Suggest Changes" # edit text
    appendFilePath: true # to append file path to Edit link

  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10 # refer: https://www.fusejs.io/api/methods.html#search
    keys: ["title", "permalink", "summary", "content"]
menu:
  main:
    - identifier: categories
      name: categories
      url: /categories/
      weight: 10
    - identifier: tags
      name: tags
      url: /tags/
      weight: 20
    - identifier: bintree
      name: bintree.org
      url: https://bintree.org
      weight: 30
# Read: https://github.com/adityatelange/hugo-PaperMod/wiki/FAQs#using-hugos-syntax-highlighter-chroma
pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false
    # anchorLineNos: true
    # codeFences: true
    # guessSyntax: true
    # lineNos: true
    # style: monokai
services:
  googleAnalytics:
    id: G-9WKR9WW6KX

