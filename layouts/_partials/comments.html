{{- if not .Params.disableComments }}
<div id="giscus-container" class="giscus"></div>
<script>
  // Определяем текущую тему PaperMod при загрузке страницы
  const getTheme = () => {
    return document.body.className.includes("dark") ? "dark" : "light";
  };

  // Берем уникальный ID из шапки статьи, либо путь к файлу (без привязки к домену)
  const term = "{{ .Params.comments_id | default .File.Path }}";

  const script = document.createElement("script");
  script.src = "https://giscus.app";
  script.setAttribute("data-repo", "stasyanko/bintree");
  script.setAttribute("data-repo-id", "R_kgDOUlLnDw");
  script.setAttribute("data-category", "Blog Comments");
  script.setAttribute("data-category-id", "ВАШ_CATEGORY_ID");
  script.setAttribute("data-mapping", "specific");
  script.setAttribute("data-term", term);
  script.setAttribute("data-strict", "1");
  script.setAttribute("data-reactions-enabled", "1");
  script.setAttribute("data-emit-metadata", "0");
  script.setAttribute("data-input-position", "top");
  script.setAttribute("data-theme", getTheme());
  script.setAttribute("data-lang", "ru");
  script.setAttribute("crossorigin", "anonymous");
  script.async = true;

  document.getElementById("giscus-container").appendChild(script);

  // Синхронизация переключения светлой и темной темы PaperMod с Giscus
  const themeToggle = document.getElementById("theme-toggle");
  if (themeToggle) {
    themeToggle.addEventListener("click", () => {
      setTimeout(() => {
        const iframe = document.querySelector("iframe.giscus-frame");
        if (iframe) {
          iframe.contentWindow.postMessage(
            { giscus: { setConfig: { theme: getTheme() } } },
            "https://giscus.app"
          );
        }
      }, 50);
    });
  }
</script>
{{- end }}
